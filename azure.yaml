# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: ai-foundry-starter-basic
services:
    concord-iq-2:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            deployments:
                - model:
                    format: Meta
                    name: Llama-3.3-70B-Instruct
                    version: "1"
                  name: Llama-3.3-70B-Instruct
                  sku:
                    capacity: 1
                    name: GlobalStandard
infra:
    provider: bicep
    path: ./infra
