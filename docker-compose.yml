name: concord-iq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: concord_iq
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord-local-only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord -d concord_iq"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - concord_iq_postgres:/var/lib/postgresql/data

volumes:
  concord_iq_postgres:
