[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "concord-iq"
version = "0.1.0"
description = "A semantic reconciliation agent that proves when operational definitions disagree."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-framework-core>=1.8,<2",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
foundry-hosting = [
  "agent-framework-foundry-hosting==1.0.0a260604",
  "mcp>=1.24,<2",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:\\[SKILLS\\].*:FutureWarning",
  "ignore:\\[HARNESS\\].*:FutureWarning",
]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
